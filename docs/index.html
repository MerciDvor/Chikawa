<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIKAWA // Asistente</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a29;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .orb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      transition: transform 0.2s, background 0.2s;
    }
    .orb.speaking { transform: scale(1.4); background: #f472b6; box-shadow: 0 0 18px #f472b6; }
    .orb.listening { transform: scale(1.3); background: #34d399; box-shadow: 0 0 18px #34d399; }
    h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--accent); }
    .badges { display: flex; gap: 8px; font-size: 0.78rem; }
    .badge {
      background: var(--panel);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      color: var(--muted);
    }
    .badge.on { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

    #music-bar {
      display: none;
      margin-top: 12px;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #music-bar.active { display: flex; }
    #song-title { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #yt-container { width: 0; height: 0; overflow: hidden; position: absolute; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.96rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-bottom-left-radius: 4px;
    }
    .msg.sys {
      align-self: center;
      font-size: 0.8rem;
      color: var(--muted);
      background: transparent;
      padding: 4px;
    }

    form {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    input {
      flex: 1;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.96rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #05080f; border: none; }
    button.mic-active { background: #ef4444; color: white; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="orb" id="orb"></div>
      <h1>CHIKAWA</h1>
    </div>
    <div class="badges">
      <span class="badge on" id="badge-dj">DJ Autoplay: ON</span>
      <span class="badge" id="badge-status">Conectando...</span>
    </div>
  </header>

  <div id="music-bar">
    <span>♪ <strong id="song-title">Sin música</strong></span>
    <button type="button" onclick="pedirSiguienteDJ()">⏭ Siguiente</button>
  </div>

  <div id="yt-container"><div id="yt-player"></div></div>

  <div id="chat">
    <div class="msg bot">Ya estoy aquí. Dime qué hacemos o qué música te pongo.</div>
  </div>

  <form id="form">
    <button type="button" id="btn-mic" title="Hablar con Chikawa">🎙</button>
    <input type="text" id="input" placeholder="Escribe o habla con Chikawa..." autocomplete="off" />
    <button type="submit" class="primary">Enviar</button>
  </form>

  <!-- API oficial de YouTube para reproducir música en segundo plano -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 🔴 REEMPLAZA ESTA URL POR LA DE TU SERVICIO EN RENDER:
    const API_URL = "https://chikawa.onrender.com";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const orbEl = document.getElementById("orb");
    const btnMic = document.getElementById("btn-mic");
    const badgeStatus = document.getElementById("badge-status");
    const badgeDj = document.getElementById("badge-dj");
    const musicBar = document.getElementById("music-bar");
    const songTitleEl = document.getElementById("song-title");

    let ytPlayer = null;
    let ytReady = false;
    let currentAudio = null;
    let escuchaContinua = false;

    // Verificar conexión con Render
    fetch(`${API_URL}/`)
      .then(r => r.json())
      .then(() => {
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");
      })
      .catch(() => {
        badgeStatus.textContent = "Despertando servidor...";
      });

    // Inicializar YouTube Player
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        height: "1",
        width: "1",
        playerVars: { autoplay: 1, controls: 0 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (event) => {
            // YT.PlayerState.ENDED === 0 -> Terminó la canción, activar DJ Autoplay
            if (event.data === 0) {
              pedirSiguienteDJ();
            }
          }
        }
      });
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function manejarAccionMusica(accion) {
      if (!accion) return;

      if (typeof accion.autoplay === "boolean") {
        badgeDj.textContent = `DJ Autoplay: ${accion.autoplay ? "ON" : "OFF"}`;
        badgeDj.classList.toggle("on", accion.autoplay);
      }

      if (!ytReady || !ytPlayer) return;

      if (accion.tipo === "play" && accion.video_id) {
        musicBar.classList.add("active");
        songTitleEl.textContent = accion.titulo || "Reproduciendo...";
        ytPlayer.setVolume(80);
        ytPlayer.loadVideoById(accion.video_id);
      } else if (accion.tipo === "pausar") {
        ytPlayer.pauseVideo();
      } else if (accion.tipo === "reanudar") {
        ytPlayer.playVideo();
      } else if (accion.tipo === "detener") {
        ytPlayer.stopVideo();
        musicBar.classList.remove("active");
      }
    }

    async function pedirSiguienteDJ() {
      agregarMensaje("♪ DJ eligiendo la siguiente canción...", "sys");
      try {
        const res = await fetch(`${API_URL}/autoplay/siguiente`, { method: "POST" });
        const data = await res.json();
        manejarAccionMusica(data.accion);
      } catch (e) {
        console.error(e);
      }
    }

    function reproducirVoz(b64) {
      if (!b64) return;
      if (currentAudio) currentAudio.pause();

      // Atenuar música mientras Chikawa habla
      if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(20);

      orbEl.classList.add("speaking");
      currentAudio = new Audio(`data:audio/mp3;base64,${b64}`);
      currentAudio.onended = () => {
        orbEl.classList.remove("speaking");
        if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(80);
        if (escuchaContinua) iniciarReconocimiento();
      };
      currentAudio.play().catch(() => {
        orbEl.classList.remove("speaking");
        if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(80);
      });
    }

    async function enviarMensaje(texto) {
      if (!texto.trim()) return;
      agregarMensaje(texto, "user");
      inputEl.value = "";

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto })
        });
        const data = await res.json();
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");

        if (data.respuesta) {
          agregarMensaje(data.respuesta, "bot");
        }
        manejarAccionMusica(data.accion);
        reproducirVoz(data.audio_b64);
      } catch (err) {
        agregarMensaje("No pude conectar con el servidor. Si estaba dormido en Render, intenta de nuevo en 30 segundos.", "sys");
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      enviarMensaje(inputEl.value);
    });

    // Reconocimiento de voz nativo del navegador
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.interimResults = false;

      recognition.onstart = () => {
        orbEl.classList.add("listening");
        btnMic.classList.add("mic-active");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        enviarMensaje(transcript);
      };

      recognition.onend = () => {
        orbEl.classList.remove("listening");
        if (!escuchaContinua) btnMic.classList.remove("mic-active");
      };
    }

    function iniciarReconocimiento() {
      if (!recognition) {
        alert("Tu navegador no soporta reconocimiento de voz.");
        return;
      }
      try { recognition.start(); } catch (e) {}
    }

    btnMic.addEventListener("click", () => {
      escuchaContinua = !escuchaContinua;
      if (escuchaContinua) {
        btnMic.classList.add("mic-active");
        iniciarReconocimiento();
      } else {
        btnMic.classList.remove("mic-active");
        if (recognition) recognition.stop();
      }
    });
  </script>
</body>
</html>
