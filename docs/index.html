<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIKAWA // Asistente</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a29;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.15rem; letter-spacing: 2px; color: var(--accent); }
    .badges { display: flex; gap: 8px; font-size: 0.75rem; }
    .badge {
      background: var(--panel);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      color: var(--muted);
    }
    .badge.on { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

    /* ── Avatar y Expresiones de Chikawa ── */
    .avatar-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 0 8px;
      position: relative;
    }
    .avatar-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
      transition: transform 0.12s ease-out, box-shadow 0.3s ease, background 0.3s ease;
      animation: breathe 3.5s ease-in-out infinite;
      cursor: pointer;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #fdf8f5 0%, #dcd4e8 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-inner svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Animaciones internas del SVG */
    #character-head {
      transform-origin: 200px 260px;
      animation: headIdle 4s ease-in-out infinite;
    }
    #ear-left {
      transform-origin: 165px 95px;
      animation: earTwitchLeft 5.2s ease-in-out infinite;
    }
    #ear-right {
      transform-origin: 265px 125px;
      animation: earTwitchRight 4.7s ease-in-out infinite;
    }

    @keyframes headIdle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.2deg); }
    }
    @keyframes earTwitchLeft {
      0%, 90%, 100% { transform: rotate(0deg); }
      94% { transform: rotate(-6deg); }
      97% { transform: rotate(2deg); }
    }
    @keyframes earTwitchRight {
      0%, 85%, 100% { transform: rotate(0deg); }
      89% { transform: rotate(7deg); }
      93% { transform: rotate(-2deg); }
    }

    /* Estados de ánimo y acción */
    .avatar-wrapper.listening {
      background: linear-gradient(135deg, #10b981, #34d399);
      box-shadow: 0 0 28px rgba(52, 211, 153, 0.65);
    }
    .avatar-wrapper.molesta {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.65);
      animation: shake 0.45s ease-in-out infinite;
    }
    .avatar-wrapper.contenta, .avatar-wrapper.juguetona {
      background: linear-gradient(135deg, #f472b6, #fbbf24);
      box-shadow: 0 0 26px rgba(244, 114, 182, 0.55);
    }
    .avatar-wrapper.preocupada, .avatar-wrapper.cansada, .avatar-wrapper.aburrida {
      background: linear-gradient(135deg, #6366f1, #64748b);
      box-shadow: 0 0 18px rgba(99, 102, 241, 0.4);
    }

    .mood-tag {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      background: var(--panel);
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      text-transform: capitalize;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    /* ── Barra de Música ── */
    #music-bar {
      display: none;
      margin-top: 6px;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #music-bar.active { display: flex; }
    #song-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Contenedor con dimensiones válidas para evitar bloqueo de autoplay de YouTube */
    #yt-container {
      width: 200px;
      height: 120px;
      position: fixed;
      bottom: 80px;
      right: 14px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }

    /* ── Chat ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 0.94rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-bottom-left-radius: 4px;
    }
    .msg.sys {
      align-self: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 2px;
    }

    form {
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    input {
      flex: 1;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 0 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: #05080f; border: none; }
    button.mic-active { background: #ef4444; color: white; border: none; }
  </style>
</head>

    // 🔴 REEMPLAZA ESTA URL POR LA DE TU SERVICIO EN RENDER:

    const chatEl = document.getElementById("chat");

    let videoPendiente = null;
    let currentAudio = null;
    let escuchaContinua = false;
    let animFrameId = null;
    let animoActual = "neutral";
    let hablando = false;

    // ── Generadores de partes faciales SVG ──
    function createOpenEye(cx, cy, scaleY = 1, pupilOffset = {x: 0, y: 0}) {
      return `
        <g transform="translate(${cx}, ${cy}) scale(1, ${scaleY})">
          <ellipse cx="0" cy="0" rx="15" ry="17" fill="#ffffff" stroke="#3b231d" stroke-width="2.5"/>
          <ellipse cx="${pupilOffset.x}" cy="${1 + pupilOffset.y}" rx="11.5" ry="14" fill="url(#eyeGrad)"/>
          <ellipse cx="${pupilOffset.x}" cy="${1 + pupilOffset.y}" rx="5.5" ry="7" fill="#3b231d"/>
          <circle cx="${-4 + pupilOffset.x}" cy="${-5 + pupilOffset.y}" r="3.8" fill="#ffffff"/>
          <circle cx="${4.5 + pupilOffset.x}" cy="${4 + pupilOffset.y}" r="2" fill="#ffffff"/>
          <path d="M -17 -4 Q 0 -22 17 -4" fill="none" stroke="#3b231d" stroke-width="4.5" stroke-linecap="round"/>
        </g>
      `;
    }

    function createClosedEye(cx, cy, tipo = "happy") {
      if (tipo === "tired") {
        return `<path d="M ${cx - 15} ${cy} Q ${cx} ${cy + 8} ${cx + 15} ${cy}" fill="none" stroke="#3b231d" stroke-width="3.5" stroke-linecap="round"/>`;
      }
      return `<path d="M ${cx - 15} ${cy + 2} Q ${cx} ${cy - 14} ${cx + 15} ${cy + 2}" fill="none" stroke="#3b231d" stroke-width="4" stroke-linecap="round"/>`;
    }

    // Mapeo completo de los estados de ánimo de Chikawa
    const expresionesChikawa = {

        fx: "",
        eyebrows: `

          <path d="M 224 165 Q 237 160 252 166" fill="none" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
        `,
        eyes: () => createOpenEye(163, 188) + createOpenEye(237, 188),
        mouth: `<path d="M 188 228 Q 200 236 212 228" fill="none" stroke="#3b231d" stroke-width="3" stroke-linecap="round"/>`
      },
      contenta: {
        blush: 0.85,
        fx: "",
        eyebrows: `
          <path d="M 148 164 Q 163 157 176 163" fill="none" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
          <path d="M 224 163 Q 237 157 252 164" fill="none" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
        `,
        eyes: () => createOpenEye(163, 188, 1.03) + createOpenEye(237, 188, 1.03),
        mouth: `
          <path d="M 185 225 Q 200 229 215 225 C 215 245, 185 245, 185 225 Z" fill="#e86f7c" stroke="#3b231d" stroke-width="2.5" stroke-linejoin="round"/>

          <path d="M 224 169 Q 237 164 252 170" fill="none" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
        `,
        eyes: () => createOpenEye(163, 188, 1, {x: 2, y: 0}) + createClosedEye(237, 190, "happy"),
        mouth: `
          <path d="M 188 228 Q 194 235 200 229 Q 206 235 212 228" fill="none" stroke="#3b231d" stroke-width="3" stroke-linecap="round"/>
          <path d="M 195 232 C 195 241, 205 241, 205 232 Z" fill="#ff8a96" stroke="#3b231d" stroke-width="2"/>

        mouth: `<ellipse cx="200" cy="233" rx="6" ry="7" fill="#e86f7c" stroke="#3b231d" stroke-width="2.2"/>`
      },
      aburrida: {
        blush: 0.25,
        fx: "",
        eyebrows: `
          <line x1="148" y1="168" x2="176" y2="168" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
          <line x1="224" y1="168" x2="252" y2="168" stroke="#4a2c1d" stroke-width="3" stroke-linecap="round"/>
        `,
        eyes: () => createOpenEye(163, 191, 0.72, {x: 4, y: -2}) + createOpenEye(237, 191, 0.72, {x: 4, y: -2}),
        mouth: `<path d="M 190 232 Q 200 230 210 233" fill="none" stroke="#3b231d" stroke-width="2.8" stroke-linecap="round"/>`
      }
    };

    function renderizarRostroSVG(animo) {
      const key = expresionesChikawa[animo] ? animo : "neutral";
      const exp = expresionesChikawa[key];
      eyebrowsContainer.innerHTML = exp.eyebrows;
      eyesContainer.innerHTML = exp.eyes();
      if (!hablando) mouthContainer.innerHTML = exp.mouth;
      extraFxContainer.innerHTML = exp.fx;
      blushGroup.setAttribute("opacity", exp.blush);
    }

    function parpadear() {
      if (animoActual === "juguetona") return;
      const tipoCierre = (animoActual === "cansada" || animoActual === "aburrida") ? "tired" : "happy";
      eyesContainer.innerHTML = createClosedEye(163, 190, tipoCierre) + createClosedEye(237, 190, tipoCierre);
      setTimeout(() => {
        const exp = expresionesChikawa[animoActual] || expresionesChikawa.neutral;
        eyesContainer.innerHTML = exp.eyes();
      }, 140);
    }

    // Parpadeo automático cada 3-6 segundos y al hacer clic
    setInterval(() => {
      if (Math.random() > 0.35) parpadear();
    }, 3200);
    avatarBox.addEventListener("click", parpadear);

    // Inicializar rostro
    renderizarRostroSVG("neutral");

    // ── Conexión Backend y Lógica Principal ──
    fetch(`${API_URL}/`)
      .then(r => r.json())
      .then(() => {
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");
      })
      .catch(() => {
        badgeStatus.textContent = "Despertando servidor...";
      });

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        height: "120",
        width: "200",
        playerVars: {
          autoplay: 1,
          controls: 0,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (event) => {
            ytReady = true;
            if (videoPendiente) {
              event.target.setVolume(80);
              event.target.loadVideoById(videoPendiente);
              event.target.playVideo();
              videoPendiente = null;
            }
          },
          onStateChange: (event) => {
            if (event.data === 0) pedirSiguienteDJ();
          },
          onError: (e) => {
            console.warn("Error de YouTube (video bloqueado para embed):", e.data);
            agregarMensaje("Ese video tiene bloqueo de reproducción, saltando a otro...", "sys");
            pedirSiguienteDJ();
          }
        }
      });
    }

    function actualizarExpresion(animo) {
      if (!animo) return;
      const limpio = animo.toLowerCase().trim();
      animoActual = expresionesChikawa[limpio] ? limpio : "neutral";
      avatarBox.classList.remove("neutral", "contenta", "molesta", "juguetona", "preocupada", "cansada", "aburrida");
      avatarBox.classList.add(animoActual);
      moodLabel.textContent = `Estado: ${animo}`;
      renderizarRostroSVG(animoActual);
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function manejarAccionMusica(accion) {
      if (!accion) return;
      if (typeof accion.autoplay === "boolean") {
        badgeDj.textContent = `DJ Autoplay: ${accion.autoplay ? "ON" : "OFF"}`;
        badgeDj.classList.toggle("on", accion.autoplay);
      }

      if (accion.tipo === "play" && accion.video_id) {
        musicBar.classList.add("active");
        songTitleEl.textContent = accion.titulo || "Reproduciendo...";
        if (!ytReady || !ytPlayer) {
          videoPendiente = accion.video_id;
          return;
        }
        ytPlayer.setVolume(hablando ? 20 : 80);
        ytPlayer.loadVideoById(accion.video_id);
        ytPlayer.playVideo();
      } else if (ytReady && ytPlayer) {
        if (accion.tipo === "pausar") ytPlayer.pauseVideo();
        else if (accion.tipo === "reanudar") ytPlayer.playVideo();
        else if (accion.tipo === "detener") {
          ytPlayer.stopVideo();
          musicBar.classList.remove("active");
        }
      }
    }

    async function pedirSiguienteDJ() {
      agregarMensaje("♪ DJ eligiendo la siguiente canción...", "sys");
      try {
        const res = await fetch(`${API_URL}/autoplay/siguiente`, { method: "POST" });
        const data = await res.json();
        manejarAccionMusica(data.accion);
        if (data.animo) actualizarExpresion(data.animo);
        if (data.respuesta) agregarMensaje(data.respuesta, "bot");
        if (data.audio_b64) reproducirVoz(data.audio_b64);
      } catch (e) {}
    }

    // Reproducción de voz con lip-sync en la boca del SVG y rebote del avatar
    function reproducirVoz(b64) {
      if (!b64) return;
      if (currentAudio) {
        currentAudio.pause();
        cancelAnimationFrame(animFrameId);
      }

      if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(20);

      currentAudio = new Audio(`data:audio/mp3;base64,${b64}`);
      avatarBox.style.animation = "none";
      hablando = true;

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(currentAudio);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        analyser.connect(ctx.destination);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function animarVoz() {
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          const scale = 1 + Math.min(avg / 420, 0.12);
          const tilt = (avg > 45) ? (Math.sin(Date.now() / 65) * 2.2) : 0;
          avatarBox.style.transform = `scale(${scale}) rotate(${tilt}deg)`;

          // Apertura de boca dinámica según volumen de voz
          const apertura = Math.min(Math.max(avg / 9, 2), 13);
          if (avg > 18) {
            mouthContainer.innerHTML = `
              <ellipse cx="200" cy="232" rx="${8 + apertura * 0.35}" ry="${apertura}" fill="#e86f7c" stroke="#3b231d" stroke-width="2.5"/>
              <ellipse cx="200" cy="${232 + apertura * 0.35}" rx="${5 + apertura * 0.2}" ry="${apertura * 0.45}" fill="#ff9aa4"/>
            `;
          } else {
            mouthContainer.innerHTML = `<path d="M 189 230 Q 200 235 211 230" fill="none" stroke="#3b231d" stroke-width="2.8" stroke-linecap="round"/>`;
          }

          animFrameId = requestAnimationFrame(animarVoz);
        }
        animarVoz();
      } catch (e) {}

      const finalizarVoz = () => {
        hablando = false;
        cancelAnimationFrame(animFrameId);
        avatarBox.style.transform = "";
        avatarBox.style.animation = "";
        renderizarRostroSVG(animoActual);
        if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(80);
        if (escuchaContinua) iniciarReconocimiento();
      };

      currentAudio.onended = finalizarVoz;
      currentAudio.play().catch(finalizarVoz);
    }

    async function enviarMensaje(texto) {
      if (!texto.trim()) return;
      agregarMensaje(texto, "user");
      inputEl.value = "";
      moodLabel.textContent = "Estado: Pensando...";

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto })
        });
        const data = await res.json();
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");

        actualizarExpresion(data.animo || "neutral");
        if (data.respuesta) agregarMensaje(data.respuesta, "bot");
        manejarAccionMusica(data.accion);
        reproducirVoz(data.audio_b64);
      } catch (err) {
        moodLabel.textContent = "Estado: Desconectada";
        agregarMensaje("No pude conectar con el servidor. Intenta de nuevo en unos segundos.", "sys");
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      enviarMensaje(inputEl.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.interimResults = false;

      recognition.onstart = () => {
        avatarBox.classList.add("listening");
        moodLabel.textContent = "Estado: Escuchando...";
        btnMic.classList.add("mic-active");
      };

      recognition.onresult = (event) => {
        enviarMensaje(event.results[0][0].transcript);
      };

      recognition.onend = () => {
        avatarBox.classList.remove("listening");
        if (!escuchaContinua) btnMic.classList.remove("mic-active");
      };
    }

    function iniciarReconocimiento() {
      if (!recognition) return alert("Tu navegador no soporta voz.");
      try { recognition.start(); } catch (e) {}
    }

    btnMic.addEventListener("click", () => {
      escuchaContinua = !escuchaContinua;
      if (escuchaContinua) {
        btnMic.classList.add("mic-active");
        iniciarReconocimiento();
      } else {
        btnMic.classList.remove("mic-active");
        if (recognition) recognition.stop();
      }
    });
  </script>
</body>
</html>
