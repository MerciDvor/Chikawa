<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHIKAWA // Asistente</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a29;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
      padding: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    h1 { font-size: 1.15rem; letter-spacing: 2px; color: var(--accent); }
    .badges { display: flex; gap: 8px; font-size: 0.75rem; }
    .badge {
      background: var(--panel);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      color: var(--muted);
    }
    .badge.on { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }

    /* ── Avatar y Expresiones de Chikawa ── */
    .avatar-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 0 8px;
      position: relative;
    }
    .avatar-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
      transition: transform 0.12s ease-out, box-shadow 0.3s ease, background 0.3s ease;
      animation: breathe 3.5s ease-in-out infinite;
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      border-radius: 50%;
      background: #fff;
      display: block;
    }

    /* Estados de ánimo y acción */
    .avatar-wrapper.listening {
      background: linear-gradient(135deg, #10b981, #34d399);
      box-shadow: 0 0 28px rgba(52, 211, 153, 0.65);
    }
    .avatar-wrapper.molesta {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.65);
      animation: shake 0.45s ease-in-out infinite;
    }
    .avatar-wrapper.contenta, .avatar-wrapper.juguetona {
      background: linear-gradient(135deg, #f472b6, #fbbf24);
      box-shadow: 0 0 26px rgba(244, 114, 182, 0.55);
    }
    .avatar-wrapper.preocupada, .avatar-wrapper.cansada {
      background: linear-gradient(135deg, #6366f1, #64748b);
      box-shadow: 0 0 18px rgba(99, 102, 241, 0.4);
    }

    .mood-tag {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      background: var(--panel);
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      text-transform: capitalize;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    /* ── Barra de Música ── */
    #music-bar {
      display: none;
      margin-top: 6px;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #music-bar.active { display: flex; }
    #song-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #yt-container { width: 0; height: 0; overflow: hidden; position: absolute; }

    /* ── Chat ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 0.94rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-bottom-left-radius: 4px;
    }
    .msg.sys {
      align-self: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 2px;
    }

    form {
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    input {
      flex: 1;
      background: var(--panel);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 0 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: #05080f; border: none; }
    button.mic-active { background: #ef4444; color: white; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>CHIKAWA</h1>
    <div class="badges">
      <span class="badge on" id="badge-dj">DJ Autoplay: ON</span>
      <span class="badge" id="badge-status">Conectando...</span>
    </div>
  </header>

  <div class="avatar-stage">
    <div class="avatar-wrapper" id="avatar-box">
      <img src="chikawa.jpg" alt="Chikawa" />
    </div>
    <div class="mood-tag" id="mood-label">Estado: Neutral</div>
  </div>

  <div id="music-bar">
    <span>♪ <strong id="song-title">Sin música</strong></span>
    <button type="button" onclick="pedirSiguienteDJ()">⏭ Siguiente</button>
  </div>

  <div id="yt-container"><div id="yt-player"></div></div>

  <div id="chat">
    <div class="msg bot">Ya estoy aquí. Dime qué hacemos o qué música te pongo.</div>
  </div>

  <form id="form">
    <button type="button" id="btn-mic" title="Hablar con Chikawa">🎙</button>
    <input type="text" id="input" placeholder="Escribe o habla con Chikawa..." autocomplete="off" />
    <button type="submit" class="primary">Enviar</button>
  </form>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 🔴 REEMPLAZA ESTA URL POR LA DE TU SERVICIO EN RENDER:
    const API_URL = "https://chikawa.onrender.com";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const avatarBox = document.getElementById("avatar-box");
    const moodLabel = document.getElementById("mood-label");
    const btnMic = document.getElementById("btn-mic");
    const badgeStatus = document.getElementById("badge-status");
    const badgeDj = document.getElementById("badge-dj");
    const musicBar = document.getElementById("music-bar");
    const songTitleEl = document.getElementById("song-title");

    let ytPlayer = null;
    let ytReady = false;
    let currentAudio = null;
    let escuchaContinua = false;
    let animFrameId = null;

    fetch(`${API_URL}/`)
      .then(r => r.json())
      .then(() => {
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");
      })
      .catch(() => {
        badgeStatus.textContent = "Despertando servidor...";
      });

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player("yt-player", {
        height: "1",
        width: "1",
        playerVars: { autoplay: 1, controls: 0 },
        events: {
          onReady: () => { ytReady = true; },
          onStateChange: (event) => {
            if (event.data === 0) pedirSiguienteDJ();
          }
        }
      });
    }

    function actualizarExpresion(animo) {
      if (!animo) return;
      avatarBox.classList.remove("neutral", "contenta", "molesta", "juguetona", "preocupada", "cansada", "aburrida");
      avatarBox.classList.add(animo);
      moodLabel.textContent = `Estado: ${animo}`;
    }

    function agregarMensaje(texto, tipo) {
      const div = document.createElement("div");
      div.className = `msg ${tipo}`;
      div.textContent = texto;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function manejarAccionMusica(accion) {
      if (!accion) return;
      if (typeof accion.autoplay === "boolean") {
        badgeDj.textContent = `DJ Autoplay: ${accion.autoplay ? "ON" : "OFF"}`;
        badgeDj.classList.toggle("on", accion.autoplay);
      }
      if (!ytReady || !ytPlayer) return;

      if (accion.tipo === "play" && accion.video_id) {
        musicBar.classList.add("active");
        songTitleEl.textContent = accion.titulo || "Reproduciendo...";
        ytPlayer.setVolume(80);
        ytPlayer.loadVideoById(accion.video_id);
      } else if (accion.tipo === "pausar") {
        ytPlayer.pauseVideo();
      } else if (accion.tipo === "reanudar") {
        ytPlayer.playVideo();
      } else if (accion.tipo === "detener") {
        ytPlayer.stopVideo();
        musicBar.classList.remove("active");
      }
    }

    async function pedirSiguienteDJ() {
      agregarMensaje("♪ DJ eligiendo la siguiente canción...", "sys");
      try {
        const res = await fetch(`${API_URL}/autoplay/siguiente`, { method: "POST" });
        const data = await res.json();
        manejarAccionMusica(data.accion);
      } catch (e) {}
    }

    // Reproducción de voz con animación reactiva al volumen (lip-sync / bounce)
    function reproducirVoz(b64) {
      if (!b64) return;
      if (currentAudio) {
        currentAudio.pause();
        cancelAnimationFrame(animFrameId);
      }

      if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(20);

      currentAudio = new Audio(`data:audio/mp3;base64,${b64}`);
      avatarBox.style.animation = "none";

      // Analizador de frecuencia para que el avatar rebote al ritmo de su voz
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(currentAudio);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        analyser.connect(ctx.destination);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function animarVoz() {
          analyser.getByteFrequencyData(dataArray);
          const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
          const scale = 1 + Math.min(avg / 380, 0.14);
          const tilt = (avg > 45) ? (Math.sin(Date.now() / 60) * 2.5) : 0;
          avatarBox.style.transform = `scale(${scale}) rotate(${tilt}deg)`;
          animFrameId = requestAnimationFrame(animarVoz);
        }
        animarVoz();
      } catch (e) {}

      currentAudio.onended = () => {
        cancelAnimationFrame(animFrameId);
        avatarBox.style.transform = "";
        avatarBox.style.animation = "";
        if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(80);
        if (escuchaContinua) iniciarReconocimiento();
      };

      currentAudio.play().catch(() => {
        cancelAnimationFrame(animFrameId);
        avatarBox.style.transform = "";
        avatarBox.style.animation = "";
        if (ytReady && ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(80);
      });
    }

    async function enviarMensaje(texto) {
      if (!texto.trim()) return;
      agregarMensaje(texto, "user");
      inputEl.value = "";
      moodLabel.textContent = "Estado: Pensando...";

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto })
        });
        const data = await res.json();
        badgeStatus.textContent = "En línea";
        badgeStatus.classList.add("on");

        actualizarExpresion(data.animo || "neutral");
        if (data.respuesta) agregarMensaje(data.respuesta, "bot");
        manejarAccionMusica(data.accion);
        reproducirVoz(data.audio_b64);
      } catch (err) {
        moodLabel.textContent = "Estado: Desconectada";
        agregarMensaje("No pude conectar con el servidor. Intenta de nuevo en unos segundos.", "sys");
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      enviarMensaje(inputEl.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "es-ES";
      recognition.interimResults = false;

      recognition.onstart = () => {
        avatarBox.classList.add("listening");
        moodLabel.textContent = "Estado: Escuchando...";
        btnMic.classList.add("mic-active");
      };

      recognition.onresult = (event) => {
        enviarMensaje(event.results[0][0].transcript);
      };

      recognition.onend = () => {
        avatarBox.classList.remove("listening");
        if (!escuchaContinua) btnMic.classList.remove("mic-active");
      };
    }

    function iniciarReconocimiento() {
      if (!recognition) return alert("Tu navegador no soporta voz.");
      try { recognition.start(); } catch (e) {}
    }

    btnMic.addEventListener("click", () => {
      escuchaContinua = !escuchaContinua;
      if (escuchaContinua) {
        btnMic.classList.add("mic-active");
        iniciarReconocimiento();
      } else {
        btnMic.classList.remove("mic-active");
        if (recognition) recognition.stop();
      }
    });
  </script>
</body>
</html>
